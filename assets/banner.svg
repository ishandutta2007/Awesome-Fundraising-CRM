<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#161b22;#0f172a;#0d1117" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#161b22">
        <animate attributeName="stop-color" values="#161b22;#0f172a;#1e293b;#161b22" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#ec4899;#6366f1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ec4899;#3b82f6;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#6366f1;#8b5cf6;#3b82f6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="2"/>

  <!-- Decorative Animated Circles -->
  <circle cx="150" cy="80" r="120" fill="#6366f1" opacity="0.08" filter="url(#glow)">
    <animate attributeName="cy" values="80;100;80" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="120;140;120" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1050" cy="240" r="160" fill="#ec4899" opacity="0.08" filter="url(#glow)">
    <animate attributeName="cy" values="240;220;240" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="r" values="160;180;160" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid Lines Accent -->
  <path d="M 0 60 Q 300 120 600 60 T 1200 60" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3">
    <animate attributeName="d" values="M 0 60 Q 300 120 600 60 T 1200 60; M 0 80 Q 300 40 600 80 T 1200 80; M 0 60 Q 300 120 600 60 T 1200 60" dur="12s" repeatCount="indefinite"/>
  </path>
  <path d="M 0 260 Q 300 200 600 260 T 1200 260" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.2">
    <animate attributeName="d" values="M 0 260 Q 300 200 600 260 T 1200 260; M 0 240 Q 300 280 600 240 T 1200 240; M 0 260 Q 300 200 600 260 T 1200 260" dur="10s" repeatCount="indefinite"/>
  </path>

  <!-- Main Title -->
  <g transform="translate(600, 135)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="url(#accentGrad)" letter-spacing="1.5" filter="url(#glow)">
      Awesome-Fundraising-CRM 💖
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 195)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="20" fill="#8b949e" letter-spacing="0.5">
      📊 Top Open-Source &amp; SaaS Donor Management Platforms for Nonprofits &amp; NGOs
    </text>
  </g>

  <!-- Interactive / Pulsing Badge -->
  <g transform="translate(600, 245)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#161b22" stroke="url(#accentGrad)" stroke-width="1.5">
      <animate attributeName="stroke-width" values="1.5;3;1.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" fill="#e6edf3" text-anchor="middle" letter-spacing="1">
      🌟 CURATED OPEN-SOURCE &amp; SAAS DIRECTORY
    </text>
  </g>
</svg>
